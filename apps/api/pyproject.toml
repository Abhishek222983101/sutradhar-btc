[project]
name = "sutradhar-api"
version = "0.1.0"
description = "Sutradhar HTTP API and background worker."
requires-python = ">=3.12,<3.13"
dependencies = [
  "sutradhar-schemas",
  "sutradhar-engine",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sutradhar_api"]
