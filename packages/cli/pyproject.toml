[project]
name = "sutradhar-cli"
version = "0.1.0"
description = "Sutradhar command-line interface."
requires-python = ">=3.12,<3.13"
dependencies = [
  "typer>=0.15",
  "sutradhar-engine",
  "sutradhar-gen",
  "sutradhar-evals",
  "sutradhar-api",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sutradhar_cli"]

[project.scripts]
sutradhar = "sutradhar_cli.main:app"
