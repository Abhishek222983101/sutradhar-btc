[project]
name = "sutradhar-api"
version = "0.1.0"
description = "Sutradhar HTTP API and background worker."
requires-python = ">=3.12,<3.13"
dependencies = [
  "sutradhar-schemas",
  "sutradhar-engine",
  "fastapi>=0.120",
  "uvicorn>=0.35",
  "sqlalchemy>=2.0.40",
  "alembic>=1.16",
  "psycopg[binary]>=3.2",
  "argon2-cffi>=25.1",
  "pyjwt>=2.10",
  "pydantic-settings>=2.9",
  "python-multipart>=0.0.20",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sutradhar_api"]
