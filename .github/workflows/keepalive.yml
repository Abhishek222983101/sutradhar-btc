name: keepalive
# Free-tier hosts sleep after idle time. A ping every 10 minutes keeps the live demo warm.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-24.04
    steps:
      - run: curl -fsS --max-time 60 --retry 3 --retry-delay 10 "${{ vars.DEMO_API_URL }}/api/health"
        if: ${{ vars.DEMO_API_URL != '' }}
