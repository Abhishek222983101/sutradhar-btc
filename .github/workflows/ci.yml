name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  python:
    name: python · lint, contracts, tests, SAST
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run lint-imports
      - run: uv run pytest -q -m "not slow"
      - run: uv run bandit -q -r packages apps/api -c pyproject.toml
  web:
    name: web · build, no external URLs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa  # v4
        with: { version: 10 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with: { node-version: 22 }
      - run: pnpm install --frozen-lockfile=false
        working-directory: apps/web
      - run: pnpm build
        working-directory: apps/web
      - run: node scripts/check-no-external-urls.mjs
        working-directory: apps/web
  offline:
    name: offline · selftest with the network disabled (I1)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: docker build -f deploy/api.Dockerfile -t sutradhar-api:ci .
      - run: docker run --rm --network none sutradhar-api:ci sutradhar selftest
