# The offline product. The API lives on an internal network with no route to the internet; only the web
# container is published, and only on localhost. Start: JWT_SECRET=$(openssl rand -hex 32) docker compose -f compose.airgap.yaml up -d
name: sutradhar
services:
  api:
    build: { context: ., dockerfile: deploy/api.Dockerfile }
    environment:
      APP_MODE: airgap
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (32+ random bytes) before starting}
      DATA_DIR: /data
      DATABASE_URL: sqlite:////data/app.sqlite
      EMBEDDED_WORKER: "true"
      OFFLINE_GUARD: "on"
      UPLOAD_MAX_MB: "2048"
    volumes: [ "sutradhar-data:/data" ]
    networks: [ backend ]
    read_only: true
    tmpfs: [ /tmp ]
    cap_drop: [ ALL ]
    security_opt: [ "no-new-privileges:true" ]
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/health', timeout=3)" ]
      interval: 10s
      timeout: 5s
      retries: 6
  web:
    build: { context: ., dockerfile: deploy/web.Dockerfile }
    ports: [ "127.0.0.1:${WEB_PORT:-8080}:8080" ]
    depends_on: { api: { condition: service_healthy } }
    networks: [ backend, edge ]
    read_only: true
    cap_drop: [ ALL ]
    cap_add: [ NET_BIND_SERVICE ]
    security_opt: [ "no-new-privileges:true" ]
    tmpfs: [ /data, /config ]
networks:
  backend: { internal: true }  # no egress: containers here cannot reach the internet
  edge: {}
volumes:
  sutradhar-data: {}
