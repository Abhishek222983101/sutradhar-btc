[project]
name = "sutradhar-engine"
version = "0.1.0"
description = "Sutradhar analytics engine: ingestion, enrichment, graph, models, explanations, evidence."
requires-python = ">=3.12,<3.13"
dependencies = [
  "sutradhar-schemas",
  "duckdb>=1.4",
  "pyarrow>=18",
  "polars>=1.18",
  "numpy>=2.1",
  "orjson>=3.10",
  "scikit-learn>=1.9.1",
  "maxminddb>=3.2.0",
  "defusedxml>=0.7.1",
  "scipy>=1.18.1",
  "networkx>=3.7",
  "lightgbm>=4.7.0",
  "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sutradhar_engine"]
